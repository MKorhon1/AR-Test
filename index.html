<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermann's Finland – AR Model</title>

  <!-- Model Viewer -library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

  <style>
    :root {
      --hermanns-orange: #d98c23;
      --hermanns-dark: #3a3430;
      --ep-blue: #00325f;
      --light-bg: #f5f5f5;
      --white: #ffffff;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--light-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: var(--hermanns-dark);
    }

    header {
      width: 100%;
      max-width: 900px;
      text-align: center;
      padding: 20px 0 10px 0;
      border-bottom: 4px solid var(--hermanns-orange);
      margin-bottom: 25px;
    }

    header img {
      width: 360px;
      max-width: 95%;
      display: block;
      margin: 0 auto;
    }

    /* --- AR BUTTON --- */
    button.ar-launch {
      margin: 15px 0 25px 0;
      padding: 14px 26px;
      background-color: var(--hermanns-orange);
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      transition: 0.2s;
    }

    button.ar-launch:hover {
      background-color: #c57d1d;
      transform: scale(1.03);
    }

    model-viewer {
      width: 100%;
      max-width: 600px;
      height: 520px;
      background-color: var(--white);
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.18);
      border: 3px solid var(--hermanns-orange);
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <header>
    <img src="HS_logo_valkoiselle.jpg" alt="Hermann's Finland logo">
  </header>

  <!-- AR BUTTON (English) -->
  <button class="ar-launch" id="arButton">📱 Open AR Model</button>

  <!-- MODEL VIEWER -->

                src="ITM-040766.glb?v=12"
                ar
                ar-modes="webxr scene-viewer quick-look"
                camera-controls
                auto-rotate>
  </model-viewer>
