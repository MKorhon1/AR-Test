<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermann's Finland – AR-malli</title>

  <!-- Model Viewer -kirjasto -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

  <style>
    /* ---------- VÄRIT (Hermann's & EP) ---------- */
    :root {
      --hermanns-orange: #d98c23;
      --hermanns-dark: #3a3430;
      --ep-blue: #00325f;
      --light-bg: #f5f5f5;
      --white: #ffffff;
    }

    /* ---------- YLEISASSETTELU ---------- */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--light-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: var(--hermanns-dark);
    }

    /* ---------- HEADER + LOGO ---------- */
    header {
      width: 100%;
      max-width: 900px;
      text-align: center;
      padding: 20px 0 10px 0;
      border-bottom: 4px solid var(--hermanns-orange);
      margin-bottom: 25px;
    }

    header img {
      width: 360px;
      max-width: 95%;
      display: block;
      margin: 0 auto;
    }

    /* ---------- OTSIKKO ---------- */
    h2 {
      margin-top: 15px;
      font-size: 26px;
      font-weight: 700;
      color: var(--ep-blue);
      text-align: center;
    }

    /* ---------- 3D MALLI ---------- */
    model-viewer {
      width: 100%;
      max-width: 600px;
      height: 520px;
      background-color: var(--white);
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.18);
      border: 3px solid var(--hermanns-orange);
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- ---------- LOGO ---------- -->
  <header>
    <img src="HS_logo_valkoiselle.jpg" alt="Hermann's Finland logo">
  </header>

  <!-- ---------- OTSIKKO ---------- -->
  <h2>3D-malli AR-näkymällä</h2>

  <!-- ---------- 3D-MALLI ---------- -->
  <model-viewer src="ITM-040766.glb"
                ar
                ar-modes="webxr scene-viewer quick-look"
                camera-controls
                auto-rotate>
  </model-viewer>

</body>
</html>
